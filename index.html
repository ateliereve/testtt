  <style>
@font-face {
  font-family: "Brother Signature";
  src: url("./BrotherSignature-7BWnK.otf") format("opentype");
  font-display: swap;
}
@font-face {
  font-family: "SUITE";
  src: url("./SUITE-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root {
  --workspace:#e9e9ec;
  --panel:#f6f6f7;
  --panel-2:#eeeeF1;
  --line:#d7d8dc;
  --line-strong:#c8c9ce;
  --text:#3b3c42;
  --muted:#85868e;
  --soft:#ededf0;
  --accent:#6d7077;
  --accent-soft:#e7e8eb;
}

* { box-sizing:border-box; }
html,body {
  margin:0;
  min-height:100%;
  color:var(--text);
  background:var(--workspace);
  font-family:"SUITE","Segoe UI","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select { font:inherit; }
button { cursor:pointer; }
button:disabled { cursor:default; opacity:.4; }

.topbar {
  height:50px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:sticky;
  top:0;
  z-index:30;
  background:#f3f3f5;
  border-bottom:1px solid #d7d8dc;
}
.brand { width:100%; text-align:center; }
.brand strong {
  display:inline-block;
  font-family:"Brother Signature", "Segoe Script", cursive;
  font-size:36px;
  line-height:.9;
  font-weight:400;
  letter-spacing:.012em;
  color:#2f3035;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
  transform:translateY(-1px);
}
.top-actions { display:none; }
.ghost-btn,.primary-btn {
  min-height:30px;
  padding:0 11px;
  border:1px solid #d2d3d7;
  border-radius:3px;
  background:#fff;
  color:#4a4b50;
  font-size:10px;
  font-weight:520;
  box-shadow:none;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}

.ghost-btn:hover { background:#f0f0f2; border-color:#c4c5ca; }
.primary-btn { background:#494a50; color:#fff; border-color:#494a50; }
.primary-btn:hover { background:#35363b; border-color:#35363b; }
.small { min-height:29px; }
.wide { width:100%; }

.app-shell {
  min-height:calc(100vh - 50px);
  display:grid;
  grid-template-columns:minmax(0,1fr) 348px;
  gap:0;
}
.stage-column {
  min-width:0;
  padding:16px;
  background:#e9e9ec;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.canvas-wrap {
  position:relative;
  width:100%;
  overflow:hidden;
  aspect-ratio:2048 / 1365;
  background:#dedfe3;
  border:1px solid #cbccd1;
  border-radius:1px;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
}
#previewCanvas {
  display:block;
  width:100%;
  height:100%;
  background:#dedfe3;
  cursor:default;
  touch-action:auto;
}
/* No large empty-state copy over the artwork. The blank canvas is intentional. */
.empty-hint { display:none !important; }

.inspector {
  position:sticky;
  top:50px;
  height:calc(100vh - 50px);
  overflow:hidden;
  display:grid;
  grid-template-rows:auto 1fr;
  background:#f6f6f7;
  border-left:1px solid #d3d4d8;
}
.inspector-tabs {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:stretch;
  height:39px;
  min-height:39px;
  position:relative;
  z-index:2;
  background:#ededf0;
  border-bottom:1px solid #d5d6da;
}
.inspector-tab {
  position:relative;
  border:0;
  border-right:1px solid #d9dade;
  background:transparent;
  color:#74757c;
  font-size:9px;
  font-weight:560;
  padding:0 2px;
}
.inspector-tab:last-child { border-right:0; }
.inspector-tab:hover { color:#3d3e44; background:#e4e4e7; }
.inspector-tab.active { color:#35363b; background:#f8f8f9; }
.inspector-tab.active::after {
  content:"";
  position:absolute;
  left:9px;
  right:9px;
  bottom:-1px;
  height:2px;
  background:var(--accent);
}
.inspector-body {
  min-height:0;
  overflow-y:scroll;
  overflow-x:hidden;
  scrollbar-gutter:stable;
  scrollbar-width:thin;
  scrollbar-color:#c3c4c9 transparent;
  background:#f6f6f7;
}
.tool-panel { display:none; }
.tool-panel.active { display:block; }
.control-card {
  padding:17px 15px 20px;
  background:#f6f6f7;
  border:0;
}
.section-heading {
  margin:0 0 15px;
  padding:0 0 9px;
  border-bottom:1px solid #dedfe2;
}
.section-heading strong {
  font-size:12px;
  font-weight:650;
  letter-spacing:-.005em;
}

.segmented {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  margin-bottom:12px;
  border:1px solid #d5d6da;
  background:#efeff1;
}
.segmented button {
  min-height:31px;
  border:0;
  border-right:1px solid #d5d6da;
  border-radius:0;
  background:transparent;
  color:#74757b;
  font-size:10px;
}
.segmented button:last-child { border-right:0; }
.segmented button.active { background:#fff; color:#3b3c42; box-shadow:inset 0 -2px 0 var(--accent); }
.segmented.three button { min-width:0; }

.file-picker {
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  gap:10px;
  min-height:46px;
  padding:8px;
  border:1px solid #d6d7db;
  background:#fff;
  cursor:pointer;
}
.file-picker:hover { background:#f8f8f9; border-color:#c8c9ce; }
.file-picker input { display:none; }
.file-picker-button {
  min-width:68px;
  height:28px;
  display:grid;
  place-items:center;
  border:1px solid #d3d4d8;
  background:#f2f2f4;
  color:#4b4c52;
  font-size:10px;
}
.file-picker-meta { min-width:0; display:grid; gap:2px; }
.file-picker-meta strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; font-weight:560; }
.file-picker-meta small { color:#94959c; font-size:9px; }

.background-upload-row {
  display:grid;
  grid-template-columns:92px minmax(0,1fr);
  gap:6px;
  align-items:stretch;
  margin-top:10px;
}
.background-upload-row .file-picker { margin-top:0; }
.tonal-link {
  min-height:46px;
  display:grid;
  place-items:center;
  padding:0 8px;
  text-decoration:none;
  white-space:nowrap;
}
.color-control-line {
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:6px;
  align-items:center;
}
.default-color-btn {
  min-height:32px;
  padding:0 10px;
  white-space:nowrap;
  font-size:10px;
}

.thumb-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin-top:8px; }
.thumb { position:relative; overflow:hidden; aspect-ratio:1; border:1px solid #d7d8dc; background:#ececef; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb span { position:absolute; right:2px; bottom:2px; padding:1px 3px; background:rgba(0,0,0,.56); color:#fff; font-size:7px; }
.thumb[draggable="true"] { cursor:grab; }
.thumb.drag-over { outline:2px solid rgba(255,255,255,.92); outline-offset:-3px; }
.thumb-order { position:absolute; left:2px; bottom:2px; display:flex; gap:2px; z-index:2; }
.thumb-order button { width:18px; height:18px; padding:0; border:1px solid rgba(255,255,255,.42); border-radius:2px; background:rgba(18,18,20,.62); color:#fff; font-size:10px; line-height:16px; }
.thumb-order button:disabled { opacity:.28; cursor:default; }

.field-row { display:grid; gap:9px; margin-top:12px; }
.field-row.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
.field-row.two.single-control { grid-template-columns:1fr; }
#featherControl[hidden] { display:none !important; }
.field-row.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
.field-row label,.duration-label,.input-stack label {
  min-width:0;
  display:grid;
  gap:6px;
  color:#67686f;
  font-size:10px;
}
.input-stack { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.input-stack label:nth-child(n+3) { grid-column:1/-1; }
input[type="text"],select {
  width:100%;
  height:32px;
  padding:0 8px;
  border:1px solid #d5d6da;
  border-radius:2px;
  outline:none;
  background:#fff;
  color:#3d3e44;
  font-size:10px;
}
input[type="text"]:focus,select:focus { border-color:#b49ca5; box-shadow:0 0 0 2px rgba(202,145,166,.10); }
input[type="range"] { width:100%; accent-color:#70737a; }
select.compact-select { font-size:10px; }

.message-list { margin-top:9px; border-top:1px solid #dedfe2; }
.message-editor { padding:10px 0; border-bottom:1px solid #e0e1e4; display:grid; gap:7px; }
.message-editor:last-child { border-bottom:0; }
.message-editor-head { display:grid; grid-template-columns:minmax(0,1fr) 68px 94px 28px; gap:5px; align-items:center; }
.message-editor-meta { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; color:#85868d; font-size:9px; }
.message-editor-palette { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px; }
input[type="color"] {
  width:100%;
  height:32px;
  padding:3px;
  border:1px solid #d5d6da;
  border-radius:2px;
  background:#fff;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
}
input[type="color"]:focus { border-color:#b49ca5; box-shadow:0 0 0 2px rgba(202,145,166,.10); }
input[type="color"]::-webkit-color-swatch-wrapper { padding:0; }
input[type="color"]::-webkit-color-swatch,
input[type="color"]::-moz-color-swatch { border:0; border-radius:0; }
.icon-btn {
  width:28px;
  height:28px;
  border:1px solid #d4d5d9;
  border-radius:2px;
  background:#fff;
  color:#62636a;
  font-size:13px;
}
.icon-btn:hover { background:#eeeeF1; }
.mini-actions { display:flex; gap:5px; margin-top:9px; }
.mini-actions button { flex:1; }
.drag-hint { margin-top:8px; color:#96979d; font-size:9px; line-height:1.45; }
.range-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.range-title output { color:#8b8c93; font-size:9px; font-variant-numeric:tabular-nums; }

.advanced-panel { margin-top:14px; border-top:1px solid #dedfe2; }
.advanced-panel summary {
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 0 5px;
  color:#67686f;
  font-size:10px;
  cursor:pointer;
}
.advanced-panel summary::-webkit-details-marker { display:none; }
.advanced-panel summary::after { content:"+"; color:#93949a; font-size:13px; }
.advanced-panel[open] summary::after { content:"–"; }
.advanced-body { padding:2px 0 1px; }
.subsection-label { margin:12px 0 5px; color:#66676d; font-size:10px; font-weight:600; }
.control-divider { height:1px; margin:11px 0; background:#dedfe2; }
.preset-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:5px; margin-top:6px; }
.preset-row.three { grid-template-columns:minmax(0,1fr) auto auto; }

.export-card { position:static; box-shadow:none; background:#f6f6f7; }
.export-buttons { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin-top:11px; }
#exportGifX { background:#494a50; color:#fff; border-color:#494a50; }
#exportGifX:hover { background:#35363b; border-color:#35363b; }
.progress { display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; margin-top:9px; }
.progress-bar { height:3px; overflow:hidden; background:#e0e1e4; }
.progress-bar span { display:block; height:100%; width:0; background:#6d7077; transition:width .16s ease; }
.progress > span { min-width:58px; text-align:right; color:#8b8c92; font-size:9px; }

.toast {
  position:fixed;
  left:50%;
  bottom:20px;
  z-index:50;
  transform:translate(-50%,12px);
  opacity:0;
  pointer-events:none;
  padding:8px 11px;
  border-radius:3px;
  background:rgba(27,29,32,.94);
  color:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
  font-size:10px;
  transition:.18s ease;
}
.toast.show { opacity:1; transform:translate(-50%,0); }

.toggle-line { display:flex; align-items:center; gap:8px; margin:12px 0 6px; font-size:11px; color:#55565d; }
.toggle-line input { width:14px; height:14px; accent-color:#6d7077; }
.helper-note { margin:0 0 10px; font-size:10px; line-height:1.55; color:#8e8f96; }

@media (max-width:900px) {
  .app-shell { grid-template-columns:1fr; }
  .stage-column { min-height:auto; padding:8px; }
  .inspector { position:static; height:auto; overflow:visible; border-left:0; border-top:1px solid #c9ccd0; }
  .inspector-tabs { position:sticky; top:0; z-index:12; }
  .inspector-body { height:560px; overflow-y:scroll; overflow-x:hidden; scrollbar-gutter:stable; }
}
@media (max-width:760px) {
  .topbar { height:46px; padding:0 10px 0 12px; }
  .brand strong { font-size:31px; }
  .app-shell { min-height:calc(100vh - 46px); }
  .stage-column { padding:6px; }
  .inspector-tabs { height:37px; }
  .inspector-tab { font-size:9px; }
  .control-card { padding:14px 12px 17px; }
  .field-row.two,.field-row.three,.input-stack { grid-template-columns:1fr; }
  .input-stack label:nth-child(n+3) { grid-column:auto; }
  .message-editor-head { grid-template-columns:minmax(0,1fr) 64px 88px 28px; }
}


/* tonal-inspired layout refresh: typography is intentionally unchanged. */
:root {
  --workspace:#f7f7f7;
  --panel:#ffffff;
  --panel-2:#f1f1f1;
  --line:#e5e5e5;
  --line-strong:#d1d1d1;
  --text:#171717;
  --muted:#777777;
  --soft:#f2f2f2;
  --accent:#171717;
  --accent-soft:#ededed;
  --stage:#262626;
  --stage-2:#2d2d2d;
  --stage-line:#404040;
}
html,body { background:var(--workspace); color:var(--text); }

.topbar {
  height:73px;
  padding:0 37px;
  display:grid;
  grid-template-columns:minmax(285px,1fr) auto minmax(285px,1fr);
  align-items:center;
  justify-content:initial;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.brand { width:auto; text-align:left; min-width:0; overflow:hidden; }
.brand strong {
  font-size:36px;
  line-height:.88;
  color:#202020;
  text-shadow:none;
  transform:translateY(1px);
  white-space:nowrap;
}
.topbar-balance { min-width:0; }

.inspector-tabs {
  position:relative;
  height:73px;
  min-height:73px;
  display:flex;
  align-items:stretch;
  justify-content:center;
  gap:34px;
  background:transparent;
  border:0;
}
.inspector-tab {
  min-width:58px;
  border:0;
  background:transparent;
  color:#898989;
  font-size:12px;
  font-weight:600;
  padding:3px 0 0;
  white-space:nowrap;
}
.inspector-tab:hover { color:#1f1f1f; background:transparent; }
.inspector-tab.active { color:#171717; background:transparent; }
.inspector-tab.active::after {
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:#171717;
}

.app-shell {
  min-height:calc(100dvh - 73px);
  display:grid;
  grid-template-columns:291px minmax(0,1fr);
  grid-template-areas:"inspector stage";
}
.inspector {
  grid-area:inspector;
  position:sticky;
  top:73px;
  height:calc(100dvh - 73px);
  overflow:hidden;
  display:block;
  background:#fff;
  border-left:0;
  border-right:1px solid var(--line);
}
.inspector-body {
  height:100%;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-gutter:stable;
  scrollbar-width:thin;
  scrollbar-color:#d6d6d6 transparent;
  background:#fff;
}
.control-card,
.export-card {
  padding:32px 28px 28px;
  background:#fff;
}
.section-heading {
  margin:0 0 22px;
  padding:0 0 18px;
  border-bottom:1px solid var(--line);
}
.section-heading strong {
  font-size:14px;
  line-height:1.3;
  font-weight:660;
  letter-spacing:-.045em;
}

.stage-column {
  grid-area:stage;
  min-width:0;
  min-height:calc(100dvh - 73px);
  padding:0 36px 34px;
  background:var(--stage);
  color:#efefef;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  overflow:auto;
}
.stage-toolbar {
  min-height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0;
}
.stage-title { display:flex; align-items:baseline; gap:11px; }
.stage-title strong { font-size:12px; font-weight:600; letter-spacing:-.01em; }
.stage-title span { font-size:11px; color:#909090; font-variant-numeric:tabular-nums; }
.stage-pause-btn {
  min-width:42px;

.background-mode-tabs { grid-template-columns:repeat(2,minmax(0,1fr)); }

.background-upload-row.single-mode .file-picker { grid-column:1 / -1; }
.background-upload-row .file-picker {

  align-self:center;
}

.tonal-link { min-height:38px; height:38px; padding:0 9px; align-self:center; font-size:10px; font-weight:620; }
.background-upload-row .tonal-link,
.background-upload-row .file-picker-button { font-size:10px; font-weight:620; }
.tool-panel[data-panel="motion"] > .field-row:first-child { margin-top:0; }
.thumb-grid { gap:5px; margin-top:10px; }

}
input[type="text"],select {

.export-buttons { gap:8px; margin-top:18px; }

</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>the aesthetic of us.</strong></div>
    <nav class="inspector-tabs" aria-label="편집 도구">
      <button class="inspector-tab active" type="button" data-panel-target="background">배경</button>
      <button class="inspector-tab" type="button" data-panel-target="booth">포토부스</button>
      <button class="inspector-tab" type="button" data-panel-target="messages">메시지</button>
      <button class="inspector-tab" type="button" data-panel-target="motion">모션</button>
      <button class="inspector-tab" type="button" data-panel-target="export">저장</button>
    </nav>
    <div class="topbar-balance" aria-hidden="true"></div>
  </header>

  <main class="app-shell">
    <section class="stage-column">
      <div class="stage-toolbar">
        <div class="stage-title"><strong>preview</strong><span>2048 × 1365</span></div>
        <button class="stage-pause-btn" id="togglePreview" type="button">정지</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="previewCanvas" width="2048" height="1365" aria-label="GIF 미리보기"></canvas>
        <div class="empty-hint" id="emptyHint" aria-hidden="true"></div>
      </div>
    </section>

    <aside class="inspector">
      <div class="inspector-body">
      <section class="control-card tool-panel active" data-panel="background">
        <div class="segmented background-mode-tabs" role="group" aria-label="배경 모드">
          <button type="button" data-bg-mode="collage" class="active">콜라주</button>
          <button type="button" data-bg-mode="single">한 장</button>
        </div>

        <div class="background-upload-row" id="backgroundUploadRow">
          <a id="tonalMatchLink" class="ghost-btn tonal-link" href="https://tonalset.vercel.app/" target="_blank" rel="noopener noreferrer">색감 맞추기</a>
          <label class="file-picker">
            <input id="backgroundInput" type="file" accept="image/*" multiple />
            <span class="file-picker-button">파일 선택</span>
            <span class="file-picker-meta"><strong id="backgroundFileStatus">선택된 이미지 없음</strong><small id="backgroundFileHint">콜라주 4~6장</small></span>
          </label>
        </div>
        <div class="thumb-grid" id="backgroundThumbs"></div>

        <div class="field-row two" id="backgroundEffectRow">
          <label id="featherControl">경계 블러
            <input id="featherRange" type="range" min="80" max="260" value="170" />
          </label>
          <label>전체 블러
            <input id="softnessRange" type="range" min="0" max="15" step="0.5" value="7.5" />
          </label>
        </div>
      </section>

      <section class="control-card tool-panel" data-panel="booth">
        <label class="file-picker">
          <input id="boothInput" type="file" accept="image/*" />
          <span class="file-picker-button">사진 선택</span>
          <span class="file-picker-meta"><strong id="boothFileStatus">선택된 사진 없음</strong><small>자동 크롭</small></span>
        </label>
        <div class="field-row three">
          <label>크기
            <input id="boothScale" type="range" min="82" max="120" value="100" />
          </label>
          <label>좌우
            <input id="boothX" type="range" min="-180" max="180" value="0" />
          </label>
          <label>상하
            <input id="boothY" type="range" min="-140" max="140" value="0" />
          </label>
        </div>

        <div class="section-heading" style="margin-top:16px"><strong>하트 효과</strong></div>
        <label class="toggle-line" for="heartStickerEnabled">
          <input id="heartStickerEnabled" type="checkbox" checked />
          <span>포토부스 하트 효과 사용</span>
        </label>
        <p class="helper-note">서로 다른 농도와 투명도의 하트가 화면 안쪽에서 차례로 생겨나 짧게 떠오릅니다.</p>
        <div class="field-row">
          <label>하트 색상
            <span class="color-control-line">
              <input id="heartColor" type="color" value="#e980aa" />
              <button id="resetHeartColor" class="ghost-btn default-color-btn" type="button">기본색상</button>
            </span>
          </label>
        </div>
        <div class="field-row three">
          <label>하트 크기
            <input id="stickerScale" type="range" min="65" max="135" value="100" />
          </label>
          <label>하트 개수
            <input id="stickerCount" type="range" min="8" max="16" step="1" value="11" />
          </label>
          <label>떠오름 속도
            <input id="stickerSpeed" type="range" min="90" max="180" value="100" />
          </label>
        </div>
        <div class="field-row two">
          <label>하트 전체 좌우
            <input id="stickerX" type="range" min="-240" max="240" value="0" />
          </label>
          <label>하트 전체 상하
            <input id="stickerY" type="range" min="-360" max="360" value="0" />
          </label>
        </div>
      </section>

      <section class="control-card tool-panel" data-panel="messages">
        <div class="input-stack">
          <label>알림 이름<input id="notifyName" type="text" value="" placeholder="You ♡" maxlength="26" /></label>
          <label>알림 내용<input id="notifyText" type="text" value="" placeholder="Are you still awake?" maxlength="42" /></label>
        </div>
        <div class="field-row" style="margin-top:10px">
          <label>문자 아이콘 색상
            <span class="color-control-line">
              <input id="notifyIconColor" type="color" value="#52ef6f" />
              <button id="resetNotifyIconColor" class="ghost-btn default-color-btn" type="button">기본색상</button>
            </span>
          </label>
        </div>
        <div class="section-heading" style="margin-top:16px"><strong>대화 메시지</strong></div>
        <div class="message-list" id="messageList"></div>
        <div class="mini-actions">
          <button id="addMessage" class="ghost-btn" type="button">메시지 추가</button>
        </div>
      </section>

      <section class="control-card tool-panel" data-panel="motion">
        <div class="field-row two selects">
          <label>모션
            <select id="animationPreset" class="compact-select">
              <option value="soft" selected>부드럽게</option>
              <option value="bouncy">통통 튀게</option>
              <option value="dreamy">느리게 몽글몽글</option>
              <option value="calm">정적인 감성</option>
            </select>
          </label>
          <label>완성 화면 유지
            <select id="holdTime" class="compact-select">
              <option value="0.5">0.5초</option>
              <option value="1">1.0초</option>
              <option value="1.5" selected>1.5초</option>
              <option value="2">2.0초</option>
              <option value="3">3.0초</option>
            </select>
          </label>
        </div>

        <label class="duration-label"><span class="range-title"><span>포토부스 → 알림 간격</span><output id="notifyGapValue">0.20초</output></span>
          <input id="notifyGap" type="range" min="0.05" max="1.2" step="0.05" value="0.20" />
        </label>

        <details class="advanced-panel">
          <summary>고급 설정</summary>
          <div class="advanced-body">
            <div class="field-row">
              <label>루프 방식
                <select id="loopMode" class="compact-select">
                  <option value="fade" selected>자연스럽게 사라지고 반복</option>
                  <option value="cut">완성 상태에서 바로 반복</option>
                  <option value="pingpong">등장 ↔ 되감기</option>
                </select>
              </label>
            </div>

            <div class="subsection-label">미리보기 구간</div>
            <div class="segmented three" role="group" aria-label="미리보기 구간">
              <button type="button" data-preview-segment="all" class="active">전체</button>
              <button type="button" data-preview-segment="entrance">등장</button>
              <button type="button" data-preview-segment="final">완성</button>
            </div>

            <div class="subsection-label">프리셋</div>
            <div class="preset-row">
              <input id="presetName" type="text" maxlength="28" placeholder="프리셋 이름" />
              <button id="savePreset" class="ghost-btn" type="button">저장</button>
            </div>
            <div class="preset-row three">
              <select id="savedPreset"><option value="">저장된 프리셋</option></select>
              <button id="loadPreset" class="ghost-btn" type="button">불러오기</button>
              <button id="deletePreset" class="ghost-btn" type="button">삭제</button>
            </div>
          </div>
        </details>
      </section>

      <section class="control-card tool-panel export-card" data-panel="export">
        <div class="field-row two selects">
          <label>해상도
            <select id="exportSize">
              <option value="1024x683">1024 × 683</option>
              <option value="1536x1024">1536 × 1024</option>
              <option value="2048x1365" selected>2048 × 1365</option>
            </select>
          </label>
          <label>프레임
            <select id="exportFps">
              <option value="8">8 fps</option>
              <option value="10">10 fps</option>
              <option value="12">12 fps</option>
              <option value="15" selected>15 fps</option>
            </select>
          </label>
        </div>
        <div class="field-row two selects">
          <label>GIF 품질
            <select id="xQuality" class="compact-select">
              <option value="quality" selected>화질 우선</option>
              <option value="balanced">균형</option>
              <option value="size">용량 우선</option>
            </select>
          </label>
          <label class="duration-label" style="margin-top:0">길이 <span id="durationValue">4.5초</span>
            <input id="durationRange" type="range" min="3" max="12" step="0.5" value="4.5" />
          </label>
        </div>

        <div class="export-buttons">
          <button id="exportPng" class="ghost-btn wide" type="button">PNG로 저장</button>
          <button id="exportGifX" class="primary-btn wide" type="button">GIF로 저장</button>
        </div>
        <div class="mini-actions" style="margin-top:10px">
          <button id="resetAll" class="ghost-btn wide" type="button">초기화</button>
        </div>
        <div class="progress" id="progressWrap" hidden>
          <div class="progress-bar"><span id="progressBar"></span></div>
          <span id="progressText">준비 중…</span>
        </div>
      </section>
      </div>
    </aside>
  </main>


  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
(() => {
  'use strict';

  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => [...document.querySelectorAll(sel)];

  const canvas = $('#previewCanvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const emptyHint = $('#emptyHint');
  const toastEl = $('#toast');
  const inspectorTabs = $$('.inspector-tab');
  function showInspectorPanel(name) {
    inspectorTabs.forEach(btn => btn.classList.toggle('active', btn.dataset.panelTarget === name));
    $$('.tool-panel').forEach(panel => panel.classList.toggle('active', panel.dataset.panel === name));
    const body = $('.inspector-body');
    if (body) body.scrollTop = 0;
  }
  inspectorTabs.forEach(btn => btn.addEventListener('click', () => showInspectorPanel(btn.dataset.panelTarget)));

  const state = {
    bgMode: 'collage',
    bgImages: [],
    boothImage: null,
    playing: true,
    animationStarted: performance.now(),
    pausedProgress: .82,
    previewSegment: 'all',
    feather: 170,
    softness: 7.5,
    boothScale: 1,
    boothX: 0,
    boothY: 0,
    stickerEnabled: true,
    stickerScale: 1,
    stickerCount: 11,
    stickerSpeed: 1.0,
    stickerX: 0,
    stickerY: 0,
    heartColor: '#e980aa',
    notifyX: 0,
    notifyY: 0,
    notifyName: '',
    notifyText: '',
    notifyIconColor: '#52ef6f',
    messages: [
      { id: 'm1', text: '', side: 'left',  blue: false, bgColor: '#f0f0f4', textColor: '#111317', delay: .40, x: 0, y: 0 },
      { id: 'm2', text: '', side: 'right', blue: true, bgColor: '#0a84ff', textColor: '#ffffff', delay: .48, x: 0, y: 0 },
      { id: 'm3', text: '', side: 'left', blue: false, bgColor: '#f0f0f4', textColor: '#111317', delay: .48, x: 0, y: 0 }
    ],
    animationPreset: 'soft',
    notifyGap: .20,
    holdTime: 1.5,
    loopMode: 'fade',
    xQuality: 'quality',
    duration: 4.5,
    exportSize: '2048x1365',
    exportFps: 15,
    bgRevision: 0
  };

  const DEFAULT_SETTINGS = JSON.parse(JSON.stringify({
    bgMode: state.bgMode,
    feather: state.feather,
    softness: state.softness,
    boothScale: state.boothScale,
    boothX: state.boothX,
    boothY: state.boothY,
    stickerEnabled: state.stickerEnabled,
    stickerScale: state.stickerScale,
    stickerCount: state.stickerCount,
    stickerSpeed: state.stickerSpeed,
    stickerX: state.stickerX,
    stickerY: state.stickerY,
    heartColor: state.heartColor,
    notifyX: state.notifyX,
    notifyY: state.notifyY,
    notifyName: state.notifyName,
    notifyText: state.notifyText,
    notifyIconColor: state.notifyIconColor,
    messages: state.messages.map(m => ({...m})),
    animationPreset: state.animationPreset,
    notifyGap: state.notifyGap,
    holdTime: state.holdTime,
    loopMode: state.loopMode,

  const bgCache = new Map();
  const boothCanvas = document.createElement('canvas');
  const boothCtx = boothCanvas.getContext('2d');
  let rafId = 0;
  function invalidateBackground() { state.bgRevision++; bgCache.clear(); }


  // Photo Booth 프레임은 하나의 오프스크린 캔버스에 합성한 뒤 통째로 애니메이션합니다.


  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function imageFromFile(file, fallbackName='image') {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({ img, url, name: file.name || fallbackName, blob: file });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image load failed')); };
      img.src = url;
    });
  }

  function cloneDefaultSettings() {
    return JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  }

  function revokeImageEntries(list = []) {
    list.forEach(item => { if (item?.url) URL.revokeObjectURL(item.url); });
  }

  function clearLoadedImages() {
    revokeImageEntries(state.bgImages);
    if (state.boothImage?.url) URL.revokeObjectURL(state.boothImage.url);
    state.bgImages = [];
    state.boothImage = null;
    const bgInput = $('#backgroundInput');
    const boothInput = $('#boothInput');
    if (bgInput) bgInput.value = '';
    if (boothInput) boothInput.value = '';
    renderBgThumbs();
    updateFileStatus();
    emptyHint.hidden = false;
    invalidateBackground();
  }

  function applySettings(settings = {}) {
    const next = Object.assign(cloneDefaultSettings(), settings || {});
    if (!settings?.notifyIconColor && settings?.notifyIconTop) next.notifyIconColor = settings.notifyIconTop;
    Object.assign(state, next);
    if (state.notifyName === 'You ♡') state.notifyName = '';
    if (state.notifyText === 'Are you still awake?') state.notifyText = '';
    if (state.bgMode === 'blur') state.bgMode = 'single';
    state.softness = clamp(+state.softness || 0, 0, 15);
    state.messages = (next.messages || cloneDefaultSettings().messages).map((m, i) => ({
      id: m.id || `m${i + 1}`,
      text: (m.text || '') === MESSAGE_PLACEHOLDERS[i] ? '' : (m.text || ''),
      side: m.side === 'right' ? 'right' : 'left',
      blue: !!m.blue,
      bgColor: typeof m.bgColor === 'string' && m.bgColor ? m.bgColor : (m.blue ? '#0a84ff' : '#f0f0f4'),
      textColor: typeof m.textColor === 'string' && m.textColor ? m.textColor : (m.blue ? '#ffffff' : '#111317'),
      delay: typeof m.delay === 'number' ? m.delay : .48,
      x: typeof m.x === 'number' ? m.x : 0,
      y: typeof m.y === 'number' ? m.y : 0
    }));
    state.bgRevision++;
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function normalizeHexColor(value, fallback = '#000000') {
    if (typeof value !== 'string') return fallback;
    const v = value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)) return v;
    if (/^#[0-9a-fA-F]{3}$/.test(v)) return '#' + v.slice(1).split('').map(ch => ch + ch).join('');
    return fallback;
  }
  function hexToRgb(hex) {
    const safe = normalizeHexColor(hex, '#000000');
    return {
      r: parseInt(safe.slice(1, 3), 16),
      g: parseInt(safe.slice(3, 5), 16),
      b: parseInt(safe.slice(5, 7), 16)
    };
  }
  function mixHexColors(a, b, t = .5) {
    const ca = hexToRgb(a), cb = hexToRgb(b), n = clamp(t, 0, 1);
    const toHex = v => Math.round(v).toString(16).padStart(2, '0');
    return `#${toHex(ca.r + (cb.r - ca.r) * n)}${toHex(ca.g + (cb.g - ca.g) * n)}${toHex(ca.b + (cb.b - ca.b) * n)}`;
  }
  function colorLuminance(hex) {
    const { r, g, b } = hexToRgb(hex);
    const srgb = [r, g, b].map(v => {
      const n = v / 255;
      return n <= .03928 ? n / 12.92 : Math.pow((n + .055) / 1.055, 2.4);
    });
    return .2126 * srgb[0] + .7152 * srgb[1] + .0722 * srgb[2];

    for (let i = 0; i < n; i++) radii.push(((i < m ? wl : wu) - 1) / 2);

  function drawBackground(c, w, h, p, opts = {}) {

    const m = cfg.bg;

  function drawPhotoBoothHeart(c, cx, cy, size, rotation, opacity, styleIndex=0) {
    const tone = PHOTO_BOOTH_HEART_TONES[styleIndex % PHOTO_BOOTH_HEART_TONES.length];
    const base = normalizeHexColor(state.heartColor, '#e980aa');
    const top = heartToneColor(base, tone.top);
    const mid = heartToneColor(base, tone.mid);
    const bottom = heartToneColor(base, tone.bottom);

  function drawBoothSticker(c, holeX, holeY, holeW, holeH, p) {

    const now = p * state.duration - effectStart;
    if (now <= 0) return;

    // Single-pass Photo Booth-like heart burst.
    // Hearts are staggered in a short mixed sequence, overlap naturally,
    // and each heart appears only once per animation cycle.
    const count = clamp(Math.round(state.stickerCount || 11), 8, 16);
    const speed = clamp(state.stickerSpeed || 1.0, .82, 1.55);
    const sizeScale = clamp(state.stickerScale || 1, .65, 1.35);

    // then the remaining hearts join over roughly half a second.

  function applyLumaDither(ctx, x, y, w, h, strength=3.2, threshold=168) {

    const ih=Math.max(1,Math.round(h));

    const data=img.data;
    const bayer4=[
      -0.46875, 0.03125,-0.34375, 0.15625,

      -0.28125, 0.21875,-0.40625, 0.09375,

    for(let yy=0;yy<ih;yy++){

  function drawBooth(c, w, h, p, opts={}) {

  function getSharedBubbleFontSize(c, w) {
    const s0 = w / 1500;

    const candidates = state.messages.map((msg,i)=>({text:displayMessageText(msg,i),maxW:(MESSAGE_BASES[i]||MESSAGE_BASES[MESSAGE_BASES.length-1]).maxW}));

  function traceSmoothPoints(c, points) {
    if (!points.length) return;
    if (points.length === 1) { c.lineTo(points[0][0], points[0][1]); return; }
    for (let i = 0; i < points.length - 1; i++) {
      const p = points[i];
      const n = points[i + 1];
      const mx = (p[0] + n[0]) / 2;
      const my = (p[1] + n[1]) / 2;
      c.quadraticCurveTo(p[0], p[1], mx, my);

    const last = points[points.length - 1];
    c.lineTo(last[0], last[1]);

  function bubblePath(c, x, y, w, h, side, s) {
    // Tail silhouette sampled from the supplied reference image and scaled by bubble height.
    // Body and tail remain one continuous path so there is no visible seam.
    const r = Math.min(31*s, h * 0.48, w * 0.49);

    // Reference tail points are normalized to the reference bubble height (425 px).
    // Coordinates are [x offset from side wall / H, y offset from bottom / H].
    const refTail = [
      [ 0.000, -0.254],
      [ 0.009, -0.207],
      [ 0.019, -0.174],
      [ 0.033, -0.141],
      [ 0.052, -0.108],
      [ 0.078, -0.075],
      [ 0.108, -0.045],
      [ 0.139, -0.021],
      [ 0.169, -0.002],
      [ 0.134, -0.002],
      [ 0.101, -0.007],
      [ 0.068, -0.012],
      [ 0.035, -0.019],
      [ 0.002, -0.026],
      [-0.031, -0.035],
      [-0.064, -0.047],
      [-0.096, -0.061],
      [-0.129, -0.075],
      [-0.162, -0.092],
      [-0.195, -0.111],
      [-0.228, -0.087],
      [-0.261, -0.066],
      [-0.294, -0.049],
      [-0.327, -0.035],
      [-0.360, -0.022],
      [-0.400, -0.010],
      [-0.460,  0.000]
    ];

    c.beginPath();

    if (side === 'right') {
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h * (1 - 0.254));

      const pts = refTail.slice(1).map(([nx, ny]) => [x + w + nx*h, y + h + ny*h]);
      traceSmoothPoints(c, pts);

      c.lineTo(x + r, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
    } else {
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r);
      c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + h * 0.460, y + h);

      const mirrored = refTail.slice(0, -1).reverse().map(([nx, ny]) => [x - nx*h, y + h + ny*h]);
      traceSmoothPoints(c, mirrored);

      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
    }

    c.closePath();
  }

  function getPreviewRange() {
    const tl=getTimeline();
    if(state.loopMode==='pingpong') {
      const holdFrac=clamp(state.holdTime/Math.max(3,state.duration),0,.42);
      const travel=(1-holdFrac)/2;
      if(state.previewSegment==='entrance') return [0,Math.max(.08,travel)];
      if(state.previewSegment==='final') return [travel,travel+Math.max(.025,holdFrac)];
    }
    if(state.previewSegment==='entrance') {
      const end=Math.min(.94,(tl.lastEnd+.2)/state.duration);
      return [0,Math.max(.15,end)];
    }
    if(state.previewSegment==='final') {
      const a=clamp((tl.lastEnd+.05)/state.duration,0,.93);
      const b=state.loopMode==='fade'?clamp(tl.fadeStart/state.duration,a+.02,.98):Math.min(.98,a+Math.max(.08,state.holdTime/state.duration));
      return [a,Math.max(a+.025,b)];
    }
    return [0,1];
  }

  function currentProgress() {
    if(!state.playing) return state.pausedProgress;
    const [a,b]=getPreviewRange();
    const span=Math.max(.025,b-a);
    const segmentSeconds=Math.max(.18,span*state.duration);
    const elapsed=(performance.now()-state.animationStarted)/1000;
    return a+((elapsed%segmentSeconds)/segmentSeconds)*span;
  }
  function finalSceneProgress() {
    const tl = getTimeline();
    const finalSec = state.loopMode === 'fade'
      ? Math.min(Math.max(tl.lastEnd + .05, tl.holdStart + .03), Math.max(tl.lastEnd + .05, tl.fadeStart - .03))
      : tl.lastEnd + Math.min(.14, Math.max(.04, state.holdTime * .25));
    return clamp(finalSec / Math.max(3, state.duration), 0, .985);
  }

  function renderPreviewOnce() {
    renderScene(ctx, canvas.width, canvas.height, currentProgress());
  }

  function animationLoop() {
    if (!state.playing) { rafId = 0; return; }
    renderPreviewOnce();
    rafId = requestAnimationFrame(animationLoop);
  }

  function ensureAnimationLoop() {
    if (state.playing && !rafId) rafId = requestAnimationFrame(animationLoop);
  }

  function restartAnimation() {
    state.animationStarted = performance.now();
    if (!state.playing) {
      state.playing = true;
      $('#togglePreview').textContent = '정지';
      $('#togglePreview').classList.remove('paused');

    renderPreviewOnce();
    ensureAnimationLoop();
  }

  // Standalone GIF89a encoder with an adaptive 256-color palette.
  // The old fixed 3-3-2 palette crushed gradients and skin tones; this version
  // builds a palette from the actual scene and uses ordered dithering.
  class ByteWriter {
    constructor(){ this.parts=[]; this.chunk=[]; this.size=0; }
    byte(v){ this.chunk.push(v & 255); if(this.chunk.length>=8192) this.flush(); }
    bytes(arr){ this.flush(); this.parts.push(arr instanceof Uint8Array ? arr : new Uint8Array(arr)); this.size += arr.length; }
    word(v){ this.byte(v); this.byte(v>>8); }
    ascii(s){ for(let i=0;i<s.length;i++) this.byte(s.charCodeAt(i)); }
    flush(){ if(this.chunk.length){ const a=new Uint8Array(this.chunk); this.parts.push(a); this.size += a.length; this.chunk=[]; } }
    blob(type){ this.flush(); return new Blob(this.parts,{type}); }
  }

  const BIN_R = k => (k >> 10) & 31;
  const BIN_G = k => (k >> 5) & 31;
  const BIN_B = k => k & 31;
  const BIN_C = v => (v << 3) + 4;

  function makeColorBox(bins, hist){
    let r0=31,r1=0,g0=31,g1=0,b0=31,b1=0,count=0;
    for(const k of bins){
      const n=hist[k]; if(!n) continue;
      const r=BIN_R(k), g=BIN_G(k), b=BIN_B(k);
      if(r<r0)r0=r; if(r>r1)r1=r;
      if(g<g0)g0=g; if(g>g1)g1=g;
      if(b<b0)b0=b; if(b>b1)b1=b;
      count += n;
    }
    return {bins,count,r0,r1,g0,g1,b0,b1};
  }

  function splitColorBox(box,hist){
    if(box.bins.length < 2) return null;
    const rr=box.r1-box.r0, gr=box.g1-box.g0, br=box.b1-box.b0;
    const channel = rr>=gr && rr>=br ? 0 : (gr>=br ? 1 : 2);
    const bins = box.bins.slice().sort((a,b)=>{
      if(channel===0) return BIN_R(a)-BIN_R(b);
      if(channel===1) return BIN_G(a)-BIN_G(b);
      return BIN_B(a)-BIN_B(b);
    });
    const half=box.count/2;
    let acc=0, cut=1;
    for(let i=0;i<bins.length-1;i++){
      acc += hist[bins[i]];
      if(acc>=half){ cut=i+1; break; }
    }
    cut=Math.max(1,Math.min(bins.length-1,cut));
    return [makeColorBox(bins.slice(0,cut),hist), makeColorBox(bins.slice(cut),hist)];
  }

  function buildPaletteFromHistogram(hist,maxColors=256,sums=null){
    const bins=[];
    for(let k=0;k<hist.length;k++) if(hist[k]) bins.push(k);
    if(!bins.length){
      const palette=new Uint8Array(256*3);
      palette.fill(255);
      return palette;
    }
    let boxes=[makeColorBox(bins,hist)];
    while(boxes.length<maxColors){
      let bi=-1,best=-1;
      for(let i=0;i<boxes.length;i++){
        const b=boxes[i];
        if(b.bins.length<2) continue;
        const range=Math.max(b.r1-b.r0,b.g1-b.g0,b.b1-b.b0)+1;
        const score=range*range*Math.sqrt(b.count);
        if(score>best){best=score;bi=i;}
      }
      if(bi<0) break;
      const parts=splitColorBox(boxes[bi],hist);
      if(!parts) break;
      boxes.splice(bi,1,parts[0],parts[1]);
    }

    const palette=new Uint8Array(256*3);
    for(let i=0;i<boxes.length;i++){
      let sr=0,sg=0,sb=0,total=0;
      for(const k of boxes[i].bins){
        const n=hist[k];
        if(sums){
          sr += sums.r[k];
          sg += sums.g[k];
          sb += sums.b[k];
        } else {
          sr += BIN_C(BIN_R(k))*n;
          sg += BIN_C(BIN_G(k))*n;
          sb += BIN_C(BIN_B(k))*n;
        }
        total += n;
      }
      const o=i*3;
      palette[o]=total?Math.round(sr/total):0;
      palette[o+1]=total?Math.round(sg/total):0;
      palette[o+2]=total?Math.round(sb/total):0;
    }
    const used=Math.max(1,boxes.length);
    for(let i=used;i<256;i++){
      palette[i*3]=palette[(used-1)*3];
      palette[i*3+1]=palette[(used-1)*3+1];
      palette[i*3+2]=palette[(used-1)*3+2];
    }
    return palette;
  }

  function buildColorStats(data,mask=null){
    const hist=new Uint32Array(32768);
    const sumR=new Uint32Array(32768);
    const sumG=new Uint32Array(32768);
    const sumB=new Uint32Array(32768);
    for(let i=0,p=0;i<data.length;i+=4,p++){
      if(mask && !mask[p]) continue;
      const r=data[i], g=data[i+1], b=data[i+2];
      const k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
      hist[k]++;
      sumR[k]+=r; sumG[k]+=g; sumB[k]+=b;
    }
    return {hist,sums:{r:sumR,g:sumG,b:sumB}};
  }

  function buildAdaptivePalette(data,maxColors=256,mask=null){
    const stats=buildColorStats(data,mask);
    return {palette:buildPaletteFromHistogram(stats.hist,maxColors,stats.sums),hist:stats.hist};
  }

  async function buildScenePalette(w,h,sampleLimit=896){
    // One global palette is kept for the whole GIF so the background never flickers.
    // The static background is sampled once, while moving content is weighted separately
    // so the Photo Booth image and message elements retain more useful colors.
    const sampleW=Math.min(sampleLimit,w);
    const sampleH=Math.max(1,Math.round(h*sampleW/w));
    const sample=document.createElement('canvas');
    sample.width=sampleW; sample.height=sampleH;
    const sc=sample.getContext('2d',{alpha:false,willReadFrequently:true});
    sc.imageSmoothingEnabled=true;
    sc.imageSmoothingQuality='high';
    const hist=new Uint32Array(32768);

    renderScene(sc,sampleW,sampleH,.5,{staticBackground:true,backgroundOnly:true});
    const base=sc.getImageData(0,0,sampleW,sampleH).data;
    for(let i=0;i<base.length;i+=4){
      const k=((base[i]>>3)<<10)|((base[i+1]>>3)<<5)|(base[i+2]>>3);
      hist[k]+=2;
    }

    const points=[.04,.12,.22,.32,.42,.52,.62,.72,.82,.91,.97];
    for(const p of points){
      renderScene(sc,sampleW,sampleH,p,{staticBackground:true,quantizeAssist:true});
      const data=sc.getImageData(0,0,sampleW,sampleH).data;
      for(let i=0;i<data.length;i+=4){
        const dr=Math.abs(data[i]-base[i]);
        const dg=Math.abs(data[i+1]-base[i+1]);
        const db=Math.abs(data[i+2]-base[i+2]);
        if(dr+dg+db < 18) continue;
        const k=((data[i]>>3)<<10)|((data[i+1]>>3)<<5)|(data[i+2]>>3);
        hist[k]+=3;
      }
      await new Promise(r=>setTimeout(r,0));
    }
    sample.width=1; sample.height=1;
    return buildPaletteFromHistogram(hist,256);
  }


  function addPaletteAnchor(stats, color, weight=700){
    const rgb=hexToRgb(normalizeHexColor(color,'#000000'));
    const k=((rgb.r>>3)<<10)|((rgb.g>>3)<<5)|(rgb.b>>3);
    stats.hist[k]+=weight;
    stats.sums.r[k]+=rgb.r*weight;
    stats.sums.g[k]+=rgb.g*weight;
    stats.sums.b[k]+=rgb.b*weight;
  }

  async function buildStableForegroundPalette(w,h,sampleLimit=896){
    // Build one palette for the settled Photo Booth + hearts + notification/messages.
    // Reusing it after the booth settles prevents the same photo/highlight from being
    // quantized to different colors in different delta frames, which is what creates
    // persistent patch boundaries in bright areas after hearts or UI move away.
    const sampleW=Math.min(sampleLimit,w);
    const sampleH=Math.max(1,Math.round(h*sampleW/w));
    const sample=document.createElement('canvas');
    sample.width=sampleW; sample.height=sampleH;
    const sc=sample.getContext('2d',{alpha:false,willReadFrequently:true});
    sc.imageSmoothingEnabled=true;
    sc.imageSmoothingQuality='high';

    renderScene(sc,sampleW,sampleH,.5,{staticBackground:true,backgroundOnly:true});
    const base=sc.getImageData(0,0,sampleW,sampleH).data;
    const stats={
      hist:new Uint32Array(32768),
      sums:{r:new Uint32Array(32768),g:new Uint32Array(32768),b:new Uint32Array(32768)}
    };

    const tl=getTimeline();
    const d=Math.max(.001,state.duration);
    const seconds=[
      tl.boothStart + (tl.boothEnd-tl.boothStart)*.35,
      Math.max(tl.boothEnd+.02,tl.boothStart),
      tl.notifyStart+.10,
      ...tl.messageStarts.map(s=>s+.10),
      Math.max(tl.lastEnd+.06,tl.notifyStart+.2),
      Math.max(tl.holdStart+.05,tl.lastEnd+.1)
    ];
    const points=seconds.map(s=>clamp(s/d,0,1));
    points.push(.72,.84,.94);
    const unique=points.filter((p,i,a)=>a.findIndex(q=>Math.abs(q-p)<.015)===i);

    for(const p of unique){
      renderScene(sc,sampleW,sampleH,p,{staticBackground:true,quantizeAssist:true});
      const data=sc.getImageData(0,0,sampleW,sampleH).data;
      for(let i=0;i<data.length;i+=4){
        const diff=Math.abs(data[i]-base[i])+Math.abs(data[i+1]-base[i+1])+Math.abs(data[i+2]-base[i+2]);
        if(diff<8) continue;
        const r=data[i],g=data[i+1],b=data[i+2];
        const k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
        stats.hist[k]++;
        stats.sums.r[k]+=r;
        stats.sums.g[k]+=g;
        stats.sums.b[k]+=b;
      }
      await new Promise(r=>setTimeout(r,0));
    }

    // Give the exact UI colors enough weight to survive the photo-heavy quantizer
    // without forcibly replacing photo palette entries.
    ['#ffffff','#111317','#1d1f24','#a8abb0','#b3b6ba','#f0f0f4','#0a84ff',state.notifyIconColor,'#f8f8fa','#f4f4f6','#e8ebef','#dbe4ee'].forEach(c=>addPaletteAnchor(stats,c,900));
    state.messages.forEach(msg=>{
      addPaletteAnchor(stats,msg.bgColor || (msg.blue?'#0a84ff':'#f0f0f4'),900);
      addPaletteAnchor(stats,msg.textColor || (msg.blue?'#ffffff':'#111317'),900);
    });

    sample.width=1; sample.height=1;
    return buildPaletteFromHistogram(stats.hist,255,stats.sums);
  }

  function buildPaletteLookup(palette,hist=null,colorCount=256){
    const lut=new Uint8Array(32768);
    const count=clamp(Math.round(colorCount||256),1,256);
    for(let k=0;k<32768;k++){
      if(hist && !hist[k]) continue;
      const r=BIN_C(BIN_R(k)), g=BIN_C(BIN_G(k)), b=BIN_C(BIN_B(k));
      let best=0,bestD=1e30;
      for(let i=0;i<count;i++){
        const o=i*3, dr=r-palette[o], dg=g-palette[o+1], db=b-palette[o+2];
        // Perceptual RGB weighting keeps luminance closer to the source image.
        const d=3*dr*dr+6*dg*dg+2*db*db;
        if(d<bestD){bestD=d;best=i;if(d===0)break;}
      }
      lut[k]=best;
    }
    return lut;
  }

  function rgbaToAdaptive(data,w,h,lut){
    const out=new Uint8Array(w*h);
    let p=0;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++,p++){
        const i=p*4;
        const k=((data[i]>>3)<<10)|((data[i+1]>>3)<<5)|(data[i+2]>>3);
        out[p]=lut[k];
      }
    }
    return out;
  }


  function rgbaToAdaptiveMasked(data,w,h,lut,mask,indexOffset=1){
    const out=new Uint8Array(w*h);

    for(let y=0;y<h;y++){

  function makeTransparentLocalPalette(sourcePalette){
    const palette=new Uint8Array(256*3);

    for(let i=0;i<255;i++){

  function rgbaToErrorDiffused(data,w,h,palette,lut){
    // Floyd-Steinberg diffusion is used only for the first full background frame.
    // It preserves average brightness and turns hard GIF gradient bands into fine texture
    // without the positive brightness bias of the previous ordered dither matrix.
    const out=new Uint8Array(w*h);
    const er0=new Float32Array(w+2), eg0=new Float32Array(w+2), eb0=new Float32Array(w+2);
    const er1=new Float32Array(w+2), eg1=new Float32Array(w+2), eb1=new Float32Array(w+2);
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const p=y*w+x, i=p*4, q=x+1;
        const r=clamp(data[i]+er0[q],0,255);
        const g=clamp(data[i+1]+eg0[q],0,255);
        const b=clamp(data[i+2]+eb0[q],0,255);
        const k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
        const pi=lut[k]; out[p]=pi;
        const o=pi*3;
        const dr=clamp(r-palette[o],-48,48);
        const dg=clamp(g-palette[o+1],-48,48);
        const db=clamp(b-palette[o+2],-48,48);
        er0[q+1]+=dr*(7/16); eg0[q+1]+=dg*(7/16); eb0[q+1]+=db*(7/16);
        er1[q-1]+=dr*(3/16); eg1[q-1]+=dg*(3/16); eb1[q-1]+=db*(3/16);
        er1[q]+=dr*(5/16); eg1[q]+=dg*(5/16); eb1[q]+=db*(5/16);
        er1[q+1]+=dr*(1/16); eg1[q+1]+=dg*(1/16); eb1[q+1]+=db*(1/16);
      }
      er0.set(er1); eg0.set(eg1); eb0.set(eb1);
      er1.fill(0); eg1.fill(0); eb1.fill(0);
    }
    return out;
  }

  function lzwEncode(indices,minCodeSize=8){
    // Standard GIF LZW compression. This keeps photo-heavy animations dramatically
    // smaller than the previous literal-only stream, allowing higher X export resolution.
    const clear=1<<minCodeSize;
    const end=clear+1;
    const firstCode=end+1;
    const out=[];
    let cur=0,bits=0;
    let codeSize=minCodeSize+1;
    let nextCode=firstCode;
    let dict=new Map();

    const writeCode=(code)=>{
      cur |= code << bits;
      bits += codeSize;
      while(bits>=8){ out.push(cur&255); cur >>>=8; bits-=8; }
    };
    const reset=()=>{
      dict=new Map();
      codeSize=minCodeSize+1;
      nextCode=firstCode;
    };

    writeCode(clear);
    if(!indices.length){
      writeCode(end);
      if(bits>0) out.push(cur&255);
      return new Uint8Array(out);
    }

    let prefix=indices[0];
    for(let i=1;i<indices.length;i++){
      const suffix=indices[i];
      const key=(prefix<<8)|suffix;
      const found=dict.get(key);
      if(found!==undefined){
        prefix=found;
        continue;
      }

      writeCode(prefix);
      if(nextCode<4096){
        dict.set(key,nextCode++);
        if(nextCode>(1<<codeSize) && codeSize<12) codeSize++;
      } else {
        writeCode(clear);
        reset();
      }
      prefix=suffix;
    }
    writeCode(prefix);
    writeCode(end);
    if(bits>0) out.push(cur&255);
    return new Uint8Array(out);
  }

  function writeSubBlocks(writer,bytes){
    for(let i=0;i<bytes.length;i+=255){ const n=Math.min(255,bytes.length-i); writer.byte(n); writer.bytes(bytes.subarray(i,i+n)); }
    writer.byte(0);
  }

  function beginGif(writer,w,h,palette){
    writer.ascii('GIF89a'); writer.word(w); writer.word(h); writer.byte(0xF7); writer.byte(0); writer.byte(0); writer.bytes(palette);
    writer.byte(0x21); writer.byte(0xFF); writer.byte(11); writer.ascii('NETSCAPE2.0'); writer.byte(3); writer.byte(1); writer.word(0); writer.byte(0);
  }

  function addGifFrame(writer,indices,w,h,delayCs,x=0,y=0,localPalette=null,transparent=false){
    // Disposal method 1 keeps the previous composited pixels in place. Local delta
    // frames use index 0 as transparent, so unchanged background pixels are never
    // re-quantized or brightened by a different frame palette.
    writer.byte(0x21); writer.byte(0xF9); writer.byte(4); writer.byte(transparent ? 0x05 : 0x04); writer.word(delayCs); writer.byte(transparent ? 0 : 0); writer.byte(0);
    writer.byte(0x2C); writer.word(x); writer.word(y); writer.word(w); writer.word(h);
    writer.byte(localPalette ? 0x87 : 0x00);
    if(localPalette) writer.bytes(localPalette);
    writer.byte(8); writeSubBlocks(writer,lzwEncode(indices,8));
  }

  function getSettledBoothRect(w,h,pad=2){
    const s0=w/1500;
    const bw=744*s0*state.boothScale;
    const bh=570*s0*state.boothScale;
    const x=(128+state.boothX)*s0;
    const y=(205+state.boothY)*s0;
    const px=Math.max(1,Math.round(pad*s0));
    const x0=clamp(Math.floor(x)-px,0,w-1);
    const y0=clamp(Math.floor(y)-px,0,h-1);
    const x1=clamp(Math.ceil(x+bw)+px,0,w);
    const y1=clamp(Math.ceil(y+bh)+px,0,h);
    if(x1<=x0 || y1<=y0) return null;
    return {x:x0,y:y0,w:x1-x0,h:y1-y0};
  }

  function cropChangedRGBA(current, previous, w, h, pad=3, threshold=3, forceRect=null){
    if(!previous || previous.length!==current.length){
      const mask=new Uint8Array(w*h); mask.fill(1);
      return {data:current,mask,x:0,y:0,w,h};
    }
    let minX=w,minY=h,maxX=-1,maxY=-1;
    const changed=new Uint8Array(w*h);
    for(let y=0;y<h;y++){
      const row=y*w;
      for(let x=0;x<w;x++){
        const p=row+x, i=p*4;
        const diff=Math.abs(current[i]-previous[i])+Math.abs(current[i+1]-previous[i+1])+Math.abs(current[i+2]-previous[i+2]);
        if(diff<=threshold) continue;
        changed[p]=1;
        if(x<minX) minX=x; if(x>maxX) maxX=x;
        if(y<minY) minY=y; if(y>maxY) maxY=y;
      }
    }

    // Once the Photo Booth entrance has finished, refresh its complete rectangle in
    // one local palette. This replaces the small palette patches accumulated during
    // the entrance with one consistent 255-color rendering, without error diffusion
    // or any extra GIF frame/timing changes.
    if(forceRect){
      const fx0=clamp(Math.floor(forceRect.x),0,w-1);
      const fy0=clamp(Math.floor(forceRect.y),0,h-1);
      const fx1=clamp(Math.ceil(forceRect.x+forceRect.w)-1,0,w-1);
      const fy1=clamp(Math.ceil(forceRect.y+forceRect.h)-1,0,h-1);
      for(let yy=fy0;yy<=fy1;yy++){
        const row=yy*w;
        for(let xx=fx0;xx<=fx1;xx++) changed[row+xx]=1;
      }
      minX=Math.min(minX,fx0); minY=Math.min(minY,fy0);
      maxX=Math.max(maxX,fx1); maxY=Math.max(maxY,fy1);
    }

    if(maxX<0 || maxY<0){
      return {data:new Uint8ClampedArray(current.slice(0,4)),mask:new Uint8Array([0]),x:0,y:0,w:1,h:1};
    }
    minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
    maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
    const cw=maxX-minX+1, ch=maxY-minY+1;
    const out=new Uint8ClampedArray(cw*ch*4);
    const mask=new Uint8Array(cw*ch);
    let o=0,m=0;
    for(let yy=minY;yy<=maxY;yy++){
      const start=(yy*w+minX)*4;
      const end=start+cw*4;
      out.set(current.subarray(start,end),o);
      for(let xx=minX;xx<=maxX;xx++,m++) mask[m]=changed[yy*w+xx];
      o+=cw*4;
    }
    return {data:out,mask,x:minX,y:minY,w:cw,h:ch};
  }


  function finishGif(writer){ writer.byte(0x3B); }

  function estimateGifBytes(w,h,fps,duration) {
    // The encoder stores one full photographic frame, then mostly transparent
    // delta rectangles. Estimate that structure without changing the proven
    // palette/delta encoder itself. This lets quality mode keep more resolution
    // without the experimental Photo Booth palette path that caused artifacts.
    const frames=Math.max(1,Math.round(fps*duration));
    const pixels=w*h;
    const firstFrame=pixels*.52;
    const entranceFrames=Math.min(frames-1,Math.max(4,Math.round(fps*.9)));
    const entrance=entranceFrames*pixels*.065;
    const remaining=Math.max(0,frames-1-entranceFrames);
    const activeRatio=(state.stickerEnabled ? .021 : .014) + Math.max(0,state.messages.length-3)*.0025;
    const deltas=remaining*pixels*activeRatio;
    const paletteOverhead=frames*850;
    return 1400+firstFrame+entrance+deltas+paletteOverhead;
  }

  function makeGifDelaySchedule(frameCount,duration){
    // GIF timing uses integer centiseconds. Distribute 8/9cs etc. across frames so
    // the saved animation keeps the requested duration instead of subtly speeding up.
    const totalCs=Math.max(frameCount*2,Math.round(duration*100));
    const delays=[];
    let prev=0;
    for(let i=1;i<=frameCount;i++){
      const next=Math.round(i*totalCs/frameCount);
      delays.push(Math.max(2,next-prev));
      prev=next;
    }
    return delays;
  }

  async function encodeGifBlob({w,h,fps,duration,onProgress,runtime}) {
    const total=Math.max(1,Math.round(fps*duration));
    const delays=makeGifDelaySchedule(total,duration);
    const work=document.createElement('canvas');
    work.width=w; work.height=h;
    const wc=work.getContext('2d',{alpha:false,willReadFrequently:true});
    wc.imageSmoothingEnabled=true;
    wc.imageSmoothingQuality='high';

    try{
      const writer=new ByteWriter();
      let previousRgba=null;
      let started=false;
      let boothPaletteRefreshed=false;

      // Prepare a single post-settle foreground palette once. The entrance may still
      // use frame-adaptive palettes, but after the booth is fully visible every booth,
      // heart and message delta is mapped through the same colors for consistency.
      const stableForegroundPalette=await buildStableForegroundPalette(w,h,runtime?.sampleW||896);
      const stableForegroundLut=buildPaletteLookup(stableForegroundPalette,null,255);
      const stableForegroundLocalPalette=makeTransparentLocalPalette(stableForegroundPalette);

      for(let i=0;i<total;i++){
        // Center sampling within each GIF frame gives smoother motion than sampling
        // exactly on the left edge of each time slice.
        const p=(i+.5)/total;
        renderScene(wc,w,h,p,{staticBackground:true,quantizeAssist:true});
        const rgba=wc.getImageData(0,0,w,h).data;

        if(i===0){
          // The first sampled frame occurs before the Photo Booth entrance, so its full
          // 256-color global table can be dedicated to the blurred/photo background.
          const first=buildAdaptivePalette(rgba,256);
          const paletteLut=buildPaletteLookup(first.palette,null,256);
          const indexed=rgbaToErrorDiffused(rgba,w,h,first.palette,paletteLut);
          beginGif(writer,w,h,first.palette);
          addGifFrame(writer,indexed,w,h,delays[i]);
          started=true;
        } else {
          // Moving content gets a local palette, while unchanged background pixels remain
          // exactly as encoded in frame 1. Keep photographic deltas on direct palette
          // mapping: masked error diffusion can create dark speckle artifacts in GIF deltas.
          const sceneP=mapLoopProgress(p);
          const sceneSec=sceneP*duration;
          const tl=getTimeline();
          const duringBoothEntrance=sceneSec<=tl.boothEnd+.03;
          const refreshBooth=!boothPaletteRefreshed && sceneSec>=tl.boothEnd;
          const forceBoothRect=refreshBooth ? getSettledBoothRect(w,h,2) : null;

          // During the entrance keep the adaptive palette because the booth is moving over
          // the background. From the first settled frame onward, switch permanently to one
          // stable foreground palette. This prevents bright Photo Booth pixels revealed by
          // fading hearts from being written back with a different palette each frame.
          const uiActive=sceneSec>=tl.notifyStart-.04;
          const delta=cropChangedRGBA(rgba,previousRgba,w,h,uiActive?4:3,duringBoothEntrance?1:(uiActive?1:3),forceBoothRect);
          let indexed,localPalette;
          if(duringBoothEntrance && !refreshBooth){
            const local=buildAdaptivePalette(delta.data,255,delta.mask);
            const localLut=buildPaletteLookup(local.palette,local.hist,255);
            localPalette=makeTransparentLocalPalette(local.palette);
            indexed=rgbaToAdaptiveMasked(delta.data,delta.w,delta.h,localLut,delta.mask,1);
          } else {
            localPalette=stableForegroundLocalPalette;
            indexed=rgbaToAdaptiveMasked(delta.data,delta.w,delta.h,stableForegroundLut,delta.mask,1);
          }
          if(!started){ beginGif(writer,w,h,localPalette); started=true; }
          addGifFrame(writer,indexed,delta.w,delta.h,delays[i],delta.x,delta.y,localPalette,true);
          if(refreshBooth) boothPaletteRefreshed=true;
        }

        previousRgba=rgba;
        if(onProgress) onProgress(i+1,total);
        await new Promise(r=>setTimeout(r,runtime?.yieldMs||0));
      }
      finishGif(writer);
      return writer.blob('image/gif');
    } finally {
      work.width=1; work.height=1;
    }
  }

  function chooseXGifPreset(maxW,currentFps,duration,targetBytes,mode='quality',maxFps=15) {
    const requested=Math.max(8,Math.min(maxFps,currentFps));
    const fpsCandidates=(mode==='quality'
      ? [requested,15,14,13,12,11,10]
      : mode==='size'
        ? [Math.min(12,requested),11,10,9,8]
        : [requested,13,12,11,10,9]
    ).map(v=>Math.max(8,Math.min(maxFps,v))).filter((v,i,a)=>a.indexOf(v)===i);

    const widths=[];
    for(let w=Math.min(2048,maxW);w>=512;w-=64) widths.push(w);
    if(maxW>=512){
      const exact=Math.max(512,Math.floor(maxW/8)*8);
      if(!widths.includes(exact)) widths.unshift(exact);
    }
    const ratio=1365/2048;
    const safety = mode==='quality' ? 0.985 : mode==='balanced' ? 0.965 : 0.94;
    const budget = targetBytes * safety;
    let best=null;

    for(const fps of fpsCandidates){
      for(const w0 of widths){
        const w=Math.max(512,Math.min(maxW,w0));
        const h=Math.max(341,Math.round(w*ratio));
        const est=estimateGifBytes(w,h,fps,duration);
        const fits=est<=budget;
        const score=(w*h*fps) + (fits ? (est/Math.max(1,budget))*1000 : -1e12) - Math.max(0,est-budget)*0.02;
        const candidate={w,h,fps,est,score,fits};
        if(!best || candidate.score>best.score) best=candidate;
      }
    }

    if(best && best.fits) return {w:best.w,h:best.h,fps:best.fps,estimatedBytes:best.est};

    let fallback=null;
    for(const fps of fpsCandidates.slice().reverse()){
      for(const w0 of widths.slice().reverse()){
        const w=Math.max(512,Math.min(maxW,w0));
        const h=Math.max(341,Math.round(w*ratio));
        const est=estimateGifBytes(w,h,fps,duration);
        const candidate={w,h,fps,est};
        if(!fallback || est<fallback.est) fallback=candidate;
      }
    }
    return {w:fallback?.w||512,h:fallback?.h||341,fps:fallback?.fps||Math.min(10,maxFps),estimatedBytes:fallback?.est||estimateGifBytes(512,341,Math.min(10,maxFps),duration)};
  }

  async function exportGifForX() {
    if(!state.bgImages.length){toast('먼저 배경 이미지를 선택해주세요.');return;}
    const btn=$('#exportGifX'),progress=$('#progressWrap'),bar=$('#progressBar'),label=$('#progressText');
    const selectedW=+(state.exportSize||$('#exportSize').value).split('x')[0];
    const requestedFps=+(state.exportFps||$('#exportFps').value);
    const duration=state.duration;
    const mode=state.xQuality||'quality';
    const runtime=runtimeGifLimits(mode);
    const baseTargetMb=mode==='quality'?14.92:mode==='balanced'?14.5:13.2;
    const targetMb=Math.min(baseTargetMb,runtime.targetCapMb);
    const targetBytes=targetMb*1024*1024;
    const safeMaxW=Math.min(selectedW,runtime.maxW);
    const safeFps=Math.min(requestedFps,runtime.maxFps);
    btn.disabled=true;btn.textContent='GIF 저장 준비 중…';progress.hidden=false;

    const preset=chooseXGifPreset(safeMaxW,safeFps,duration,targetBytes,mode,runtime.maxFps);
    try{
      label.textContent=`${preset.w}×${preset.h} · ${preset.fps} fps`;
      bar.style.width='0%';
      const blob=await encodeGifBlob({...preset,duration,runtime,onProgress:(done,total)=>{
        const pct=Math.round(done/total*100);
        bar.style.width=pct+'%';
        label.textContent=`${preset.w}×${preset.h} · ${preset.fps} fps · ${pct}%`;
      }});
      const size=blob.size;
      if(size<=targetBytes){
        downloadBlob(blob,'the-aesthetic-of-us.gif');
        toast(`GIF 저장 완료 · ${(size/1024/1024).toFixed(1)} MB · ${preset.w}×${preset.h} · ${preset.fps} fps`);
      } else {
        toast(`15MB를 초과했습니다. 현재 ${(size/1024/1024).toFixed(1)}MB예요. 길이를 조금 줄이거나 해상도를 낮춰 다시 시도해주세요.`);
      }
    }catch(err){console.error(err);toast('GIF 생성 중 오류가 발생했습니다.');}
    finally{btn.disabled=false;btn.textContent='GIF로 저장';setTimeout(()=>{progress.hidden=true;bar.style.width='0';},1000);}
  }

  $('#exportGifX').addEventListener('click',exportGifForX);

  document.addEventListener('visibilitychange',()=>{ if(document.hidden) persistAutosave(true).catch(()=>{}); });
  window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(AUTOSAVE_SETTINGS_KEY, JSON.stringify(captureSettings())); }catch{} });

  ensureDurationForTimeline();
  renderMessageEditor();
  refreshPresetList();
  syncControlsFromState();
  renderPreviewOnce();
  ensureAnimationLoop();
  loadAutosave().then(restored=>{ if(restored) toast('이전 작업을 복원했어요.'); }).catch(err=>console.error(err));
})();

</script>
